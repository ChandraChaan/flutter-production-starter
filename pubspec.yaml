name: flutter_production_starter
description: "A production-ready Flutter starter: clean architecture, Riverpod, go_router, environments, typed errors, SSL pinning, l10n and CI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.6.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/certs/
